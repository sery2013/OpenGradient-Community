<!DOCTYPE html>
<html>
<head>
  <title>Mint Test</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
</head>
<body>
  <button onclick="mint()">MINT TEST</button>
  <div id="status"></div>

  <script>
    async function mint() {
      const status = document.getElementById('status');
      if (!window.ethereum) return status.textContent = 'Install MetaMask';

      try {
        await window.ethereum.request({ method: 'eth_requestAccounts' });
        const provider = new ethers.JsonRpcProvider("https://rpc.ritualfoundation.org", {
          chainId: 1979,
          name: "ritual-testnet"
        }, { staticNetwork: true });

        const signer = await provider.getSigner();
        const contractAddress = "0x30412DD5eAf58a8491b2f728140dEb3CDCF83C26";
        const abi = [{"inputs":[{"internalType":"address","name":"to","type":"address"},{"internalType":"string","name":"username","type":"string"},{"internalType":"uint256","name":"posts","type":"uint256"},{"internalType":"uint256","name":"retweets","type":"uint256"},{"internalType":"uint256","name":"comments","type":"uint256"},{"internalType":"uint256","name":"likes","type":"uint256"},{"internalType":"uint256","name":"views","type":"uint256"},{"internalType":"string","name":"imageData","type":"string"}],"name":"mintCard","outputs":[],"stateMutability":"payable","type":"function"}];

        const contract = new ethers.Contract(contractAddress, abi, signer);

        const tx = await contract.mintCard(
          await signer.getAddress(),
          "test",
          1, 0, 0, 0, 0, "",
          { value: ethers.parseEther("0.0001"), gasPrice: ethers.parseUnits("1", "gwei") }
        );

        status.textContent = "✅ Tx sent: " + tx.hash;
        const receipt = await tx.wait();
        status.textContent += " | Confirmed: " + receipt.status;
      } catch (e) {
        status.textContent = "❌ " + (e.message || e);
        console.error(e);
      }
    }
  </script>
</body>
</html>

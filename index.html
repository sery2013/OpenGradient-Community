<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ritual Leaderboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <span class="logo-dot"></span>
                RITUAL STATS
            </div>
            <nav class="tabs-nav">
                <button class="tab-btn active" data-tab="leaderboard">📊 Leaderboard</button>
                <button class="tab-btn" data-tab="nft-gallery">🖼️ NFT Gallery</button>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="content">
            <header class="top-bar">
                <div class="stats-overview">
                    <div class="stat-card">
                        <span class="stat-label">Total Posts</span>
                        <span id="total-posts" class="stat-value">0</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label">Total Users</span>
                        <span id="total-users" class="stat-value">0</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label">Total Views</span>
                        <span id="total-views" class="stat-value">0</span>
                    </div>
                </div>
            </header>

            <div id="leaderboard-wrapper" class="tab-content active">
                <div class="filters">
                    <div class="search-box">
                        <input type="text" id="search" placeholder="Search user...">
                    </div>
                    <select id="time-select">
                        <option value="all">All Time</option>
                        <option value="7">Last 7 Days</option>
                        <option value="30">Last 30 Days</option>
                    </select>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>User</th>
                                <th id="posts-header" class="sortable">Posts <span class="sort-arrow"></span></th>
                                <th id="likes-header" class="sortable">Likes <span class="sort-arrow"></span></th>
                                <th id="retweets-header" class="sortable">RTs <span class="sort-arrow"></span></th>
                                <th id="comments-header" class="sortable">Comments <span class="sort-arrow"></span></th>
                                <th id="views-col-header" class="sortable">Views <span class="sort-arrow"></span></th>
                            </tr>
                        </thead>
                        <tbody id="leaderboard-body"></tbody>
                    </table>
                </div>

                <div class="pagination">
                    <button id="prev-page">←</button>
                    <span id="page-info">Page 1 / 1</span>
                    <button id="next-page">→</button>
                </div>
            </div>

            <div id="tab-nft-gallery" class="tab-content" style="display:none;">
                <div class="gallery-grid" id="nft-grid"></div>
            </div>
        </main>
    </div>

    <!-- Modal for Card Generation -->
    <div id="card-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h3>Generate Member Card</h3>
            <div class="canvas-wrapper">
                <canvas id="user-canvas" width="1200" height="675"></canvas>
            </div>
            <div class="modal-actions">
                <button id="btn-download" class="primary-btn">Download PNG</button>
                <button id="btn-mint" onclick="mintCardNFT()" class="mint-btn">Mint NFT (0.01 RITUAL)</button>
            </div>
            <p id="mint-status"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
